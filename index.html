<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Tracker</title>
    <link rel="stylesheet" href="index.css" />
    <script src="./scripts/index.js" defer></script>
    <script src="./scripts/theme.js" defer></script>
  </head>
  <body>
    <div class="Hero">
      <h2>Lead Tracker</h2>
    </div>
    <div class="inputContainer">
      <div class="inputPlace">
        <input type="text" id="inputField" placeholder="Enter Lead URL" />
        <div class="buttonContainer">
          <button id="saveButton">Save Lead</button>
          <button id="tabSaveButton">Save Tab</button>
        </div>
      </div>

      <div class="dltContainer">
        <input
          type="number"
          id="dltField"
          placeholder="Enter Lead number to delete"
        />
        <button id="dltButton">Delete</button>
        <button id="dltAllButton">Delete All</button>
      </div>
    </div>
    <ul id="unOrdListofLeads"></ul>
  </body>
</html>
