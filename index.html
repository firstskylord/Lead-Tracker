<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="index.css" />
    <script src="./scripts/index.js" defer></script>
    <script src="./scripts/theme.js" defer></script>
  </head>

      <h2>Lead Tracker</h2>
      <a id="appThemeMode">

          height="24px"
          viewBox="0 0 24 24"
          version="1.1"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          fill="#000000"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
            <title>ic_fluent_dark_theme_24_regular</title>
            <desc>Created with Sketch.</desc>
            <g
              id="🔍-Product-Icons"
              stroke="none"
              stroke-width="1"
              fill="none"
              fill-rule="evenodd"
            >
              <g
                id="ic_fluent_dark_theme_24_regular"
                fill="#e7fff4"
                fill-rule="nonzero"
              >
                <path
                  d="M12,22 C17.5228475,22 22,17.5228475 22,12 C22,6.4771525 17.5228475,2 12,2 C6.4771525,2 2,6.4771525 2,12 C2,17.5228475 6.4771525,22 12,22 Z M12,20.5 L12,3.5 C16.6944204,3.5 20.5,7.30557963 20.5,12 C20.5,16.6944204 16.6944204,20.5 12,20.5 Z"

    </div>
    <div class="inputContainer">
      <div class="inputPlace">
        <input type="text" id="inputField" placeholder="Enter Lead URL" />
        <div class="buttonContainer">
          <button id="saveButton">Save Lead</button>
          <button id="tabSaveButton">Save Tab</button>
        </div>
      </div>

      <div class="dltContainer">
        <input
          type="number"
          id="dltField"
          placeholder="Enter Lead number to delete"
        />
        <button id="dltButton">Delete</button>
        <button id="dltAllButton">Delete All</button>
      </div>
    </div>
    <ul id="unOrdListofLeads"></ul>
